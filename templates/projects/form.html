{% extends 'base.html' %}

{% block title %}{{ title }} - AI Time Management{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold m-0">{{ title }}</h3>
      <a href="{% url 'project_list' %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
    </div>

    <div class="card shadow-sm p-4">
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-semibold">Project Name</label>
          {{ form.name }}
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Description</label>
          {{ form.description }}
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Status</label>
            {{ form.status }}
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Priority (1-10)</label>
            {{ form.priority }}
          </div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Start Date</label>
            {{ form.start_date }}
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Deadline</label>
            {{ form.deadline }}
          </div>
        </div>
        <button type="submit" class="btn btn-primary px-4 fw-semibold mt-2">
          Save Project
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
