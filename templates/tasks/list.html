{% extends 'base.html' %}

{% block title %}Tasks - AI Time Management{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h3 class="fw-bold m-0">Task Management</h3>
    <p class="text-muted small m-0">Track task assignments, dead-lines, actual time vs estimated time</p>
  </div>
  <a href="{% url 'task_create' %}" class="btn btn-primary btn-sm">
    <i class="bi bi-plus-lg me-1"></i> New Task
  </a>
</div>

<!-- Filters Bar -->
<div class="card shadow-sm mb-4">
  <div class="card-body py-3">
    <form class="row g-2 align-items-center" hx-get="{% url 'task_list' %}" hx-target="#task-table-container" hx-trigger="change">
      <div class="col-md-4">
        <select name="status" class="form-select form-select-sm">
          <option value="">All Statuses</option>
          <option value="TODO" {% if selected_status == 'TODO' %}selected{% endif %}>To Do</option>
          <option value="IN_PROGRESS" {% if selected_status == 'IN_PROGRESS' %}selected{% endif %}>In Progress</option>
          <option value="BLOCKED" {% if selected_status == 'BLOCKED' %}selected{% endif %}>Blocked</option>
          <option value="COMPLETED" {% if selected_status == 'COMPLETED' %}selected{% endif %}>Completed</option>
        </select>
      </div>
      <div class="col-md-4">
        <select name="project_id" class="form-select form-select-sm">
          <option value="">All Projects</option>
          {% for p in projects %}
            <option value="{{ p.id }}" {% if selected_project == p.id|stringformat:"s" %}selected{% endif %}>{{ p.name }}</option>
          {% endfor %}
        </select>
      </div>
    </form>
  </div>
</div>

<!-- Task Table Container (Swapped by HTMX) -->
<div class="card shadow-sm" id="task-table-container">
  {% include 'tasks/partials/task_table.html' %}
</div>
{% endblock %}
